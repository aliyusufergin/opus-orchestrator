# The test cases (the spec's seam 3). Each task names the repository it is cloned from, the
# commit to start from, the prompt the Orchestrator gets, and either a check or a known answer.
#
# - start: the clone holds this commit and its history only. For a revert-and-redo task it is
#   the parent of the original commit, so that commit is not in the clone to be found.
# - check: a bash command run in the clone after Claude ends; exit code 0 is a pass.
# - reference, reference_files: before the check runs, these files are taken from the
#   reference commit (the original solution) and put into the clone. They are its acceptance
#   tests, so the prompt names the interface those tests use. A dry run also checks that the
#   check passes at the reference.
# - answer: the points a correct answer makes. The user judges the final message against it.

