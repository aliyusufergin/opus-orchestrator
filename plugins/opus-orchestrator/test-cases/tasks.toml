check = "python3 tests/test_updater.py"
prompt = """
Make the updater, scripts/updater.py, follow ffmpeg releases. Today it copies the ffmpeg entry from the lock file unchanged.

The updater resolves the newest mwader/static-ffmpeg release on Docker Hub and its image index digest, and plans a build when either changes.

- Version selection: list the repository's tags and pick the highest release numerically, including a new major. FFmpeg names a line's first release X.Y and its patches X.Y.Z, and mwader's X.Y tags are separate images (9.0 differs from 9.0.1), so both X.Y and X.Y.Z count as releases: a new line such as 10.0 is followed before 10.0.1 exists. Ignore every other tag, such as latest, X.Y-N rebuilds and per-architecture tags like 9.0.1-arm64.
- Digest: record the selected tag's index digest from an anonymous manifest HEAD request, as the updater already does for n8n. When the digest differs from the locked one, fetch the index by digest; it must hash to that digest and contain linux/amd64 and linux/arm64, otherwise the run fails. An unchanged digest names an index that was already checked, so a steady-state run makes no Docker Hub pull.
- Build decision: a new version plans a build, a new digest under the same version plans a build, otherwise no build is planned.
- Registry GETs need Docker Hub's anonymous token, like the HEAD requests. A failed token request fails the run rather than passing for a missing tag.
- Tests use recorded responses through the existing replay mechanism and never touch the network.

The acceptance tests replay these requests, recorded under tests/fixtures/upstream/ffmpeg-9.0.1/:
- GET https://registry-1.docker.io/v2/mwader/static-ffmpeg/tags/list
- HEAD https://registry-1.docker.io/v2/mwader/static-ffmpeg/manifests/<tag>
- GET https://registry-1.docker.io/v2/mwader/static-ffmpeg/manifests/<digest>

and expect:
- the lock entry {"ffmpeg": {"version": "9.0.1", "image_digest": "sha256:..."}};
- the change summaries "ffmpeg 8.1.2 → 9.0.1" and "ffmpeg 9.0.1 republished", in the same form as n8n's;
- failures that exit 1 with nothing on stdout and these on stderr: "mwader/static-ffmpeg:9.0.1 index has no linux/amd64" (or linux/arm64, also for a single-platform manifest), "mwader/static-ffmpeg:9.0.1 index does not match its digest", and an error naming mwader/static-ffmpeg:9.0.1 when a listed tag has no manifest.
"""

[[tasks]]
id = "investigation"
title = "How the n8n updater handles a missing tag (read-only)"
repository = "~/projects/n8n-custom-ytdlp"
start = "7e7d4141def240302dfcfa5a677eb0c0f370afa7"
prompt = """
How does the n8n updater handle a missing tag? Explain each case and what the run does in it. This is an investigation only: don't change any files.
"""
answer = """
- A missing Docker tag is found with an anonymous manifest HEAD request to Docker Hub for n8nio/n8n and n8nio/runners at the version's tag; a 404 means the tag doesn't exist (index_digest returns None).
- A newly planned version whose tag is missing on either image is skipped for this run: the updater keeps the locked n8n entry, notes "<repository>:<version> is not pushed yet; keeping n8n <locked>" on stderr and doesn't fail. A later scheduled run retries.
- A missing tag of the locked version itself fails the run without a plan ("... of the locked n8n version no longer exists").
- Without a lock file to fall back on, a missing tag fails the run ("... is not pushed yet and no lock file names an n8n version to keep").
- When n8n's latest release is 3.x or later, the updater follows the highest n8n@2.Y.Z Git tag on the locked minor; if that patch's images were never pushed, it is skipped like any version not pushed yet, without falling back to an earlier patch.
- A failed Docker Hub token request fails the run instead of passing for a missing tag.
"""

