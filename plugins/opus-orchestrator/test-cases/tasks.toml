id = "bug-fix"
title = "Fail on a vanished locked n8n tag (revert and redo n8n-custom-ytdlp 5683b06)"
repository = "~/projects/n8n-custom-ytdlp"
start = "556a9dd7d38ee75782ad56231359cf60d5f8e3f4"
reference = "5683b067b4121a7cf1c0728c2422aeabf1871e2b"
reference_files = ["tests/test_updater.py"]
check = "python3 tests/test_updater.py"
prompt = """
Fix a bug in the updater, scripts/updater.py.

When the n8n version in the lock file no longer has its Docker tag (n8nio/n8n or n8nio/runners), the updater treats it like a newly released version whose images aren't pushed yet: it keeps the locked version and the run succeeds. But a tag of the locked version that no longer exists means the lock can't be built any more, so that run must fail without a plan: exit code 1, nothing on stdout, and an error on stderr that names the missing image as <repository>:<version>, such as n8nio/runners:2.38.7, without a traceback. Only a newly planned version whose tag is missing is still skipped for the run.

Cover it in the updater's recorded-response tests, tests/test_updater.py.
"""

